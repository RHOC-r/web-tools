<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    文字数カウント｜無料で文字数・行数をリアルタイム計測
  </title>

  <meta
    name="description"
    content="文章を入力するだけで文字数、空白を除いた文字数、行数、単語数をリアルタイムで確認できる無料の文字数カウントツールです。"
  >

  <meta
    name="robots"
    content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
  >

  <link rel="canonical" href="https://rin081321.github.io/web-tools/tools/counter.html">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:site_name" content="Web便利ツール">
  <meta property="og:title" content="文字数カウント｜無料で文字数・行数をリアルタイム計測">
  <meta property="og:description" content="文章の文字数、空白除外文字数、行数、単語数をリアルタイムで確認できます。">
  <meta property="og:url" content="https://rin081321.github.io/web-tools/tools/counter.html">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="文字数カウント｜無料で文字数・行数をリアルタイム計測">
  <meta name="twitter:description" content="文章の文字数、空白除外文字数、行数、単語数をリアルタイムで確認できます。">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "文字数カウント",
    "url": "https://rin081321.github.io/web-tools/tools/counter.html",
    "description": "文章の文字数、空白除外文字数、行数、単語数をリアルタイムで確認できる無料ツールです。",
    "applicationCategory": "UtilitiesApplication",
    "operatingSystem": "Any",
    "browserRequirements": "JavaScript対応ブラウザ",
    "inLanguage": "ja",
    "isAccessibleForFree": true
  }
  </script>

  <link
    rel="stylesheet"
    href="../css/style.css"
  >


  <style>

    textarea {
      width: 100%;
      height: 300px;

      box-sizing: border-box;

      padding: 15px;

      resize: vertical;

      font-size: 16px;

      border:
        1px solid #ccc;

      border-radius: 8px;
    }


    .counter-result {

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 12px;

      margin-top: 20px;

    }


    .counter-item {

      background: #f5f7fb;

      padding: 18px;

      text-align: center;

      border-radius: 10px;

    }


    .counter-number {

      font-size: 28px;

      font-weight: bold;

    }


    .tool-description {

      margin-top: 50px;

      line-height: 1.8;

    }


    .tool-description h2 {

      margin-top: 30px;

      margin-bottom: 10px;

    }


    @media (max-width: 600px) {

      .counter-result {

        grid-template-columns:
          repeat(2, 1fr);

      }

    }

  </style>

</head>


<body>


<div id="sidebar-container"></div>


<div class="main-content">

  <header>

    <a
      href="../index.html"
      class="logo"
    >
      Web便利ツール
    </a>

  </header>


  <main class="container tool-page">


    <div class="tool-box">

      <h1 class="tool-title">
        文字数カウント
      </h1>


      <textarea
        id="textInput"
        placeholder="ここに文章を入力してください..."
      ></textarea>


      <div class="counter-result">


        <div class="counter-item">

          <div
            class="counter-number"
            id="charCount"
          >
            0
          </div>

          <div>
            文字数
          </div>

        </div>


        <div class="counter-item">

          <div
            class="counter-number"
            id="noSpaceCount"
          >
            0
          </div>

          <div>
            空白除外
          </div>

        </div>


        <div class="counter-item">

          <div
            class="counter-number"
            id="lineCount"
          >
            0
          </div>

          <div>
            行数
          </div>

        </div>


        <div class="counter-item">

          <div
            class="counter-number"
            id="wordCount"
          >
            0
          </div>

          <div>
            単語数
          </div>

        </div>


      </div>

    </div>


    <section class="tool-description">

      <h2>
        文字数カウントとは
      </h2>

      <p>
        入力した文章の文字数をリアルタイムで
        確認できる無料ツールです。
      </p>


      <h2>
        使い方
      </h2>

      <p>
        上の入力欄に文章を入力するだけで、
        文字数・空白を除いた文字数・行数・単語数が
        自動的に計算されます。
      </p>


      <h2>
        こんなときに便利です
      </h2>

      <ul>

        <li>
          レポートの文字数確認
        </li>

        <li>
          ブログ記事の文字数確認
        </li>

        <li>
          SNS投稿の文字数確認
        </li>

        <li>
          文章作成時のチェック
        </li>

      </ul>

    </section>


  </main>

</div>


<script src="../js/sidebar.js"></script>

<script src="../js/counter.js"></script>


</body>

</html>
