<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>文字数カウント | Web便利ツール</title>

  <link rel="stylesheet" href="../css/style.css">

  <style>
    textarea {
      width: 100%;
      height: 300px;
      padding: 15px;
      resize: vertical;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .counter-result {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .counter-item {
      background: #f5f7fb;
      padding: 18px;
      text-align: center;
      border-radius: 10px;
    }

    .counter-number {
      font-size: 28px;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .counter-result {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>

</head>

<body>

<header>
  <a href="../index.html" class="logo">Web便利ツール</a>
</header>

<main class="container tool-page">

  <div class="tool-box">

    <h1 class="tool-title">文字数カウント</h1>

    <textarea
      id="textInput"
      placeholder="ここに文章を入力してください..."
    ></textarea>

    <div class="counter-result">

      <div class="counter-item">
        <div class="counter-number" id="charCount">0</div>
        <div>文字数</div>
      </div>

      <div class="counter-item">
        <div class="counter-number" id="noSpaceCount">0</div>
        <div>空白除外</div>
      </div>

      <div class="counter-item">
        <div class="counter-number" id="lineCount">0</div>
        <div>行数</div>
      </div>

      <div class="counter-item">
        <div class="counter-number" id="wordCount">0</div>
        <div>単語数</div>
      </div>

    </div>

  </div>

</main>

<script src="../js/counter.js"></script>

</body>
</html>
