<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>タイマー | Web便利ツール</title>

<link rel="stylesheet" href="../css/style.css">

<style>

.timer {
  text-align: center;
}

.timer-inputs {

  display: flex;
  justify-content: center;
  align-items: center;

  gap: 10px;

  margin-bottom: 25px;

}

.timer-inputs input {

  width: 90px;

  padding: 10px;

  text-align: center;

  font-size: 20px;

  border: 1px solid #ccc;

  border-radius: 8px;

}

.timer-display {

  font-size: 64px;

  font-weight: bold;

  margin: 30px 0;

}

.timer-buttons {

  display: flex;
  justify-content: center;

  gap: 10px;

}

</style>

</head>


<body>


<header>

<a href="../index.html"
   class="logo">

Web便利ツール

</a>

</header>


<main class="container tool-page">


<div class="tool-box timer">


<h1 class="tool-title">

タイマー

</h1>


<div class="timer-inputs">

<input
  type="number"
  id="hours"
  min="0"
  placeholder="時"
>

<span>:</span>


<input
  type="number"
  id="minutes"
  min="0"
  max="59"
  placeholder="分"
>

<span>:</span>


<input
  type="number"
  id="seconds"
  min="0"
  max="59"
  placeholder="秒"
>

</div>


<div
  id="timerDisplay"
  class="timer-display">

00:00:00

</div>


<div class="timer-buttons">

<button
  class="primary-button"
  onclick="startTimer()">

開始

</button>


<button
  class="secondary-button"
  onclick="pauseTimer()">

一時停止

</button>


<button
  class="secondary-button"
  onclick="resetTimer()">

リセット

</button>


</div>


</div>


</main>


<script src="../js/timer.js"></script>

</body>

</html>
