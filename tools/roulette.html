<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>無料ルーレット｜アニメーション抽選ツール</title><meta name="description" content="候補を入力してカラフルなルーレットで抽選できる無料ツールです。滑らかな回転アニメーション、効果音、当選履歴、当選項目の除外に対応。"><meta name="robots" content="index, follow"><link rel="canonical" href="https://RHOC-r.github.io/web-tools/tools/roulette.html"><meta property="og:type" content="website"><meta property="og:title" content="無料ルーレット"><meta property="og:description" content="候補を入力してアニメーション付きルーレットで抽選。"><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"無料ルーレット","applicationCategory":"GameApplication","operatingSystem":"Any","isAccessibleForFree":true}</script><link rel="stylesheet" href="../css/style.css"><style>.roulette-layout{display:grid;grid-template-columns:minmax(320px,1.1fr) minmax(280px,.9fr);gap:22px;align-items:start}.wheel-card,.settings-card{padding:24px;border-radius:18px;background:#fff;box-shadow:0 8px 28px #0f172a17}.wheel-wrap{position:relative;display:grid;place-items:center;max-width:600px;margin:auto}.wheel-wrap:before{content:"";position:absolute;z-index:3;top:-3px;width:0;height:0;border-left:19px solid transparent;border-right:19px solid transparent;border-top:42px solid #ef4444;filter:drop-shadow(0 3px 2px #0004)}#wheel{width:100%;aspect-ratio:1;filter:drop-shadow(0 12px 14px #0f172a2d)}.spin-button{position:absolute;z-index:4;width:104px;height:104px;border-radius:50%;border:8px solid #fff;background:linear-gradient(145deg,#7c3aed,#4f46e5);box-shadow:0 6px 18px #0005;color:#fff;font-size:20px;font-weight:900}.spin-button:disabled{opacity:.65}.roulette-input{width:100%;min-height:230px;padding:14px;border:1px solid #cbd5e1;border-radius:10px;font:15px/1.7 inherit}.setting-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:14px 0}.winner{display:none;margin-top:18px;padding:20px;border-radius:14px;background:linear-gradient(135deg,#fef3c7,#fff7ed);text-align:center;animation:pop .55s cubic-bezier(.2,.9,.3,1.3)}.winner.show{display:block}.winner strong{display:block;margin-top:6px;color:#7c2d12;font-size:30px}.history{display:grid;gap:7px;margin-top:12px}.history div{padding:9px 12px;border-radius:8px;background:#f8fafc}.confetti{position:fixed;z-index:9999;width:10px;height:16px;pointer-events:none;animation:fall 1.8s ease-in forwards}@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-4deg)}to{opacity:1;transform:scale(1)}}@keyframes fall{to{transform:translate(var(--x),100vh) rotate(720deg);opacity:0}}@media(max-width:850px){.roulette-layout{grid-template-columns:1fr}.spin-button{width:86px;height:86px}}</style></head><body><div id="sidebar-container"></div><div class="main-content"><header><a href="../index.html" class="logo">Web便利ツール</a></header><main class="container tool-page"><h1 class="tool-title">🎡 ルーレット</h1><div class="local-badge">🎯 公平なランダム抽選</div><p class="advanced-intro">候補を入力して中央の「回す」を押してください。滑らかに回転し、ゆっくり減速して当選者を決定します。</p><div class="roulette-layout"><section class="wheel-card"><div class="wheel-wrap"><canvas id="wheel" width="800" height="800"></canvas><button id="spin" class="spin-button">回す</button></div><div id="winner" class="winner"><span>🎉 当選</span><strong id="winnerName"></strong><div class="advanced-actions" style="justify-content:center"><button id="removeWinner" class="secondary-button">当選項目を除外</button></div></div></section><section class="settings-card"><h2>ルーレットの候補</h2><textarea id="items" class="roulette-input">りんご
みかん
ぶどう
バナナ
いちご
メロン</textarea><div class="setting-row"><label><input id="sound" type="checkbox" checked> 効果音</label><span id="itemCount">6項目</span></div><div class="advanced-actions"><button id="shuffle" class="secondary-button">候補をシャッフル</button><button id="reset" class="secondary-button">履歴を消去</button></div><h2 style="margin-top:24px">当選履歴</h2><div id="history" class="history"><div>まだ抽選されていません。</div></div></section></div><section class="tool-description"><h2>ルーレットの使い方</h2><p>抽選したい名前や選択肢を1行に1つ入力します。学校、イベント、ゲーム、順番決め、プレゼント抽選などに利用できます。</p><h2>抽選方法</h2><p>ブラウザの暗号学的乱数を使って停止位置を決定し、回転アニメーションで結果を表示します。同じ項目を複数行入力すると当選確率を調整できます。</p></section></main></div><script src="../js/sidebar.js"></script><script src="../js/roulette.js"></script></body></html>
